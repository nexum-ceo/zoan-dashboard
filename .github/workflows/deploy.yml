name: Deploy to VPS with Git Commit Tag

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create .env
        run: |
          echo "${{ secrets.ENV_FILE_DEV }}" > .env

      - name: 🚀 Pull latest code & build/run Docker on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_FILE_DEV
          script: |
            set -e
            cd ~/zoan-dashboard

            echo "Fetching latest changes..."
            git fetch origin dev
            git checkout dev
            git pull origin dev

            echo "Creating .env file from GitHub secret..."
            echo "$ENV_FILE_DEV" > .env

            COMMIT_ID=$(git rev-parse --short HEAD)
            echo "Building Docker image with tag: zoan-dashboard:${COMMIT_ID}"
            docker build --no-cache -t zoan-dashboard:${COMMIT_ID} .

            echo "Stopping previous container..."
            docker stop zoan-dashboard || true
            docker rm zoan-dashboard || true

            echo "Running new container..."
            docker run -d --name zoan-dashboard -p 3000:3000 zoan-dashboard:${COMMIT_ID}
        env:
          ENV_FILE_DEV: ${{ secrets.ENV_FILE_DEV }}
